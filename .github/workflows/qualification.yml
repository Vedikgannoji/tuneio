name: Manual reliability qualification
on:
  workflow_dispatch:
jobs:
  qualification:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e ".[test,benchmark]"
      - run: node --test tests/workflow.test.cjs tests/product_ui.test.cjs
      - run: python -m pytest --junitxml=tmp/test-results.xml
      - run: python -m tuneio.quality coverage.json
      - run: tuneio benchmark --profile qualification --output tmp/qualification.json
      - if: always()
        run: tuneio benchmark --profile soak --duration-seconds 1800 --orders 50000 --requests 100 --output tmp/soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.os }}
          path: |
            coverage.json
            tmp/test-results.xml
            tmp/qualification.json
            tmp/soak.json
