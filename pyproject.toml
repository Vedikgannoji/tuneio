[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tuneio*"]

[tool.setuptools.package-data]
tuneio = ["*.html", "*.js", "*.css", "scenario_presets.json"]

[project]
name = "tuneio"
dynamic = ["version"]
description = "Local API observation proxy with explicit public-read caching and auditable adaptive policies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers"
]
dependencies = ["fastapi>=0.104.1,<1", "uvicorn>=0.24,<1", "pydantic>=2.5,<3", "httpx>=0.27,<1"]

[tool.setuptools.dynamic]
version = {attr = "tuneio._version.__version__"}

[project.urls]
Repository = "https://github.com/Vedikgannoji/API-Performance-Auto-Tuner"
Issues = "https://github.com/Vedikgannoji/API-Performance-Auto-Tuner/issues"

[project.scripts]
tuneio = "tuneio.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=7.4,<9", "pytest-cov>=5,<8", "httpx>=0.27,<1"]
benchmark = ["psutil>=5.9,<8"]
release = ["build>=1.2,<2", "twine>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tuneio --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90"

